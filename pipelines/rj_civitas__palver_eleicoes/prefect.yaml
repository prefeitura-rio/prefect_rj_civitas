name: rj_civitas__palver_eleicoes
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_civitas/deployments
      tag: "rj_civitas__palver_eleicoes-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_civitas__palver_eleicoes/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_civitas

deployments:
  - name: rj-civitas--palver_eleicoes--staging
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_civitas__palver_eleicoes/flow.py:rj_civitas__palver_eleicoes
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_civitas__palver_eleicoes -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging  #pragma: allowlist secret
        image_pull_policy: Always
  - name: rj-civitas--palver_eleicoes--prod
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_civitas__palver_eleicoes/flow.py:rj_civitas__palver_eleicoes
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_civitas__palver_eleicoes -- prefect flow-run execute
        secretName: prefect-jobs-secrets  #pragma: allowlist secret
        image_pull_policy: Always

    schedules:
    - interval: 300 # executa a cada 5 minutos
      anchor_date: "2026-10-01T00:03:00" # Data de inicio do schedule em UTC
      timezone: America/Sao_Paulo
      slug: palver_eleicoes_every_five_minutes
      parameters:
        mode: prod
        start_date: "2026-10-02 18:00:00"